<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1424" />
      <stop offset="50%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#05080f" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="124" stroke="url(#cyanGrad)" stroke-width="4" stroke-opacity="0.3" fill="none" />

  <!-- Outer ambient circuit circle -->
  <circle cx="256" cy="256" r="180" stroke="url(#cyanGrad)" stroke-width="2" stroke-dasharray="12 16" stroke-opacity="0.3" />

  <!-- Nexo Stylized Geometric 'N' & Node Network -->
  <g filter="url(#glow)">
    <!-- Left vertical bar -->
    <path d="M 160 140 L 195 140 L 195 372 L 160 372 Z" fill="url(#cyanGrad)" rx="6" />
    <!-- Diagonal stroke -->
    <path d="M 185 140 L 327 348 L 352 348 L 195 170 Z" fill="url(#glowGrad)" />
    <!-- Right vertical bar -->
    <path d="M 317 140 L 352 140 L 352 372 L 317 372 Z" fill="url(#cyanGrad)" rx="6" />
    <!-- Central nexus node -->
    <circle cx="256" cy="256" r="16" fill="#00f2fe" />
    <circle cx="256" cy="256" r="8" fill="#ffffff" />
    <!-- Top-left node -->
    <circle cx="178" cy="140" r="10" fill="#38bdf8" />
    <!-- Bottom-right node -->
    <circle cx="335" cy="372" r="10" fill="#00f2fe" />
  </g>
</svg>
